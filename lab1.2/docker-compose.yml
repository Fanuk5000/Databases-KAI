services:
  postgres:
    image: postgres:18.6-alpine
    container_name: lab1_2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lab_measurements
      POSTGRES_USER: lab_student
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pg_data_1_2:/var/lib/postgresql/data

volumes:
  pg_data_1_2:
