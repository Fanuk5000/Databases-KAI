services:
  postgres:
    image: postgres:18.6-alpine
    container_name: lab1_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lab_measurements
      POSTGRES_USER: lab_student
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - ./data:/data
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pg_data:/var/lib/postgresqlage

volumes:
  pg_data:
